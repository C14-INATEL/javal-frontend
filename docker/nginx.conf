server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Mesmo comportamento que o proxy do Vite em dev: /api-backend → backend na máquina anfitriã.
    location /api-backend/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spring (CORS) costuma autorizar só http://localhost:5173 (Vite). O site no Docker usa :5174
        # e o browser envia Origin: http://localhost:5174 → 403 "Invalid CORS request". Isto alinha com o dev.
        # Corretivo definitivo: incluir http://localhost:5174 em allowedOrigins no backend.
        proxy_set_header Origin "http://localhost:5173";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
