name: javal-frontend

volumes:
  jenkins-data:

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: javal-frontend:prod
    container_name: javal-frontend-web
    restart: unless-stopped
    ports:
      - "5174:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: javal-jenkins:lts
    container_name: jenkins-javal-frontend
    restart: unless-stopped
    # Host 9080 → Jenkins 8080 no container (evita conflito se já tiveres algo na 8080)
    ports:
      - "9080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
