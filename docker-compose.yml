volumes:
  jenkins-data:

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: javal-jenkins:lts
    container_name: jenkins-javal-frontend
    restart: unless-stopped
    # Host 9080 → Jenkins 8080 no container (evita conflito se já tiveres algo na 8080)
    ports:
      - "9080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
